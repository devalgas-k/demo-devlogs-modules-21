<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <title>Data Flow - MCP Spring Boot</title>
  <desc>Flux de données d'une requête MCP typique</desc>

  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #e5e7eb; }
    .label-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f3f4f6; }
    .step { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #9ca3af; }
  </style>

  <!-- Fond sombre -->
  <rect width="900" height="250" fill="#1f2937"/>

  <!-- Étape 1: Requête reçue -->
  <rect x="30" y="90" width="120" height="70" rx="8" ry="8" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="90" y="120" text-anchor="middle" class="label-bold">1. Requête reçue</text>
  <text x="90" y="140" text-anchor="middle" class="step">(JSON-RPC)</text>

  <!-- Ligne -->
  <line x1="150" y1="125" x2="190" y2="125" stroke="#6b7280" stroke-width="2"/>

  <!-- Étape 2: Parsing -->
  <rect x="200" y="90" width="120" height="70" rx="8" ry="8" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="120" text-anchor="middle" class="label-bold">2. Parsing</text>
  <text x="260" y="140" text-anchor="middle" class="step">Validation JSON</text>

  <!-- Ligne -->
  <line x1="320" y1="125" x2="360" y2="125" stroke="#6b7280" stroke-width="2"/>

  <!-- Étape 3: Recherche outil -->
  <rect x="370" y="90" width="120" height="70" rx="8" ry="8" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="430" y="120" text-anchor="middle" class="label-bold">3. Recherche outil</text>
  <text x="430" y="140" text-anchor="middle" class="step">ToolRegistry</text>

  <!-- Ligne -->
  <line x1="490" y1="125" x2="530" y2="125" stroke="#6b7280" stroke-width="2"/>

  <!-- Étape 4: Exécution -->
  <rect x="540" y="90" width="120" height="70" rx="8" ry="8" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="120" text-anchor="middle" class="label-bold">4. Exécution</text>
  <text x="600" y="140" text-anchor="middle" class="step">Appel Spring AI</text>

  <!-- Ligne -->
  <line x1="660" y1="125" x2="700" y2="125" stroke="#6b7280" stroke-width="2"/>

  <!-- Étape 5: Construction réponse -->
  <rect x="710" y="90" width="120" height="70" rx="8" ry="8" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="770" y="120" text-anchor="middle" class="label-bold">5. Réponse</text>
  <text x="770" y="140" text-anchor="middle" class="step">JSON-RPC result</text>

  <!-- Ligne -->
  <line x1="830" y1="125" x2="870" y2="125" stroke="#6b7280" stroke-width="2"/>

  <!-- Étape 6: Retour client -->
  <rect x="790" y="185" width="80" height="40" rx="8" ry="8" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <text x="830" y="210" text-anchor="middle" class="label-bold">Client</text>

  <!-- Ligne verticale vers le haut -->
  <line x1="830" y1="160" x2="830" y2="125" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="830" y1="160" x2="790" y2="160" stroke="#6b7280" stroke-width="2"/>

  <!-- Titre -->
  <text x="450" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f3f4f6">Flux de données MCP</text>
  <text x="450" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">Flux horizontal d'une requête MCP typique</text>
</svg>

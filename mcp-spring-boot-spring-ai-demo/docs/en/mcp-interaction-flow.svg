<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>MCP Interaction Flow - MCP Spring Boot</title>
  <desc>MCP function call sequence diagram</desc>

  <style>
    .actor { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f3f4f6; }
    .step { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #e5e7eb; }
    .step-small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #9ca3af; }
    .decision { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #fbbf24; }
  </style>

  <!-- Dark background -->
  <rect width="800" height="480" fill="#1f2937"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f3f4f6">MCP Interaction Flow - Function Calls</text>

  <!-- Actor vertical lines -->
  <line x1="120" y1="80" x2="120" y2="430" stroke="#4b5563" stroke-width="2"/>
  <line x1="320" y1="80" x2="320" y2="430" stroke="#4b5563" stroke-width="2"/>
  <line x1="520" y1="80" x2="520" y2="430" stroke="#4b5563" stroke-width="2"/>
  <line x1="680" y1="80" x2="680" y2="430" stroke="#4b5563" stroke-width="2"/>

  <!-- Actors -->
  <rect x="60" y="60" width="120" height="35" rx="6" ry="6" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="120" y="83" text-anchor="middle" class="actor">User</text>

  <rect x="260" y="60" width="120" height="35" rx="6" ry="6" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="320" y="83" text-anchor="middle" class="actor">LLM</text>

  <rect x="460" y="60" width="120" height="35" rx="6" ry="6" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="83" text-anchor="middle" class="actor">MCP Server</text>

  <rect x="620" y="60" width="120" height="35" rx="6" ry="6" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <text x="680" y="83" text-anchor="middle" class="actor">Tool</text>

  <!-- Messages -->

  <!-- 1. User prompt -->
  <line x1="120" y1="115" x2="320" y2="115" stroke="#6b7280" stroke-width="2"/>
  <text x="220" y="108" text-anchor="middle" class="step">1. User prompt</text>

  <!-- 2. LLM decision -->
  <rect x="260" y="140" width="120" height="35" rx="6" ry="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" class="step">Tool needed?</text>

  <!-- 3. Yes - Tool call -->
  <line x1="320" y1="195" x2="520" y2="195" stroke="#6b7280" stroke-width="2"/>
  <text x="420" y="188" text-anchor="middle" class="step">2. Tool call</text>

  <!-- 4. Execution -->
  <line x1="520" y1="215" x2="680" y2="215" stroke="#6b7280" stroke-width="2"/>
  <text x="600" y="208" text-anchor="middle" class="step">3. Execution</text>

  <!-- 5. Result -->
  <line x1="680" y1="245" x2="520" y2="245" stroke="#6b7280" stroke-width="2"/>
  <text x="600" y="238" text-anchor="middle" class="step">4. Result</text>

  <!-- 6. Return to LLM -->
  <line x1="520" y1="285" x2="320" y2="285" stroke="#6b7280" stroke-width="2"/>
  <text x="420" y="278" text-anchor="middle" class="step">5. Result to LLM</text>

  <!-- 7. Final response -->
  <line x1="320" y1="330" x2="120" y2="330" stroke="#6b7280" stroke-width="2"/>
  <text x="220" y="323" text-anchor="middle" class="step">6. Final response</text>

  <!-- No branch - goes down then right -->
  <line x1="380" y1="175" x2="380" y2="250" stroke="#6b7280" stroke-width="2"/>
  <line x1="380" y1="250" x2="490" y2="250" stroke="#6b7280" stroke-width="2"/>
  <text x="490" y="245" text-anchor="start" class="decision">NO</text>
  <text x="490" y="265" text-anchor="start" class="step-small">(Direct response)</text>

  <!-- Section frames -->
  <rect x="260" y="130" width="120" height="60" rx="6" ry="6" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="460" y="180" width="120" height="120" rx="6" ry="6" fill="none" stroke="#1e40af" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Section labels -->
  <text x="320" y="380" text-anchor="middle" class="step-small">LLM Decision</text>
  <text x="520" y="380" text-anchor="middle" class="step-small">MCP Processing</text>

  <!-- Footer note -->
  <text x="400" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b7280">MCP Sequence Diagram - Function call steps</text>
</svg>
